<style>

var INFO={
 build:{t:'Membangun pembangkit',h:'<p>Pilih <b>jenis</b>, <b>merek</b>, dan <b>kapasitas</b> mesin, lalu klik daratan di peta untuk menaruhnya.</p><ul><li><b>Tahun menentukan pilihan.</b> Jenis dan merek baru muncul sesuai sejarah. PLTD dan PLTU ada sejak 1945, PLTG sejak 1965, PLTP sejak 1975, PLTS dan PLTB sejak 1990.</li><li><b>Mesin makin baik seiring tahun.</b> Mesin lama lebih boros dan lebih sering rusak. Ukuran unit dan harga mengikuti skala zaman, jadi angka megawatt di 1945 jauh lebih kecil daripada di 2026.</li><li><b>Merek murah</b> menekan biaya awal tetapi boros dan rewel. <b>Merek premium</b> mahal tetapi irit dan awet.</li><li>Lokasi menentukan biaya, rugi transmisi, penyinaran, dan kekuatan angin. <b>Kondisi medan</b>: pegunungan lebih mahal dan lebih lama dibangun daripada dataran, surya paling sensitif terhadap medan berbukit, angin justru lebih kencang di dataran tinggi.</li><li><b>Bahan bakar</b>: PLTU, PLTG, dan PLTD butuh angkutan dari tambang, ladang gas, atau depot BBM (titik di peta). Makin jauh, apalagi lewat laut, biaya bahan bakar makin besar. Sumber baru muncul sesuai tahun.</li><li>PLTP hanya bisa dibangun dekat gunung api.</li></ul>'},
 assets:{t:'Aset dan upgrade',h:'<p>Daftar pembangkit milik Anda. Ketuk satu baris untuk membuka tombolnya.</p><ul><li><b>Rawat</b>: menghentikan mesin beberapa hari, tetapi menurunkan risiko rusak. Perawatan otomatis berjalan bila kas cukup.</li><li><b>Overhaul Lv 1 sampai 3</b>: keluaran naik 5%, pemakaian bahan bakar turun 4%, dan risiko gangguan turun 12% per level. Mesin berhenti 8 hari.</li><li><b>Perbesar kapasitas</b>: mesin diganti dengan ukuran berikutnya dari merek yang sama, nilai lama diperhitungkan 50%.</li><li><b>Kondisi dan umur</b>: mesin aus seiring waktu. Makin aus, keluaran turun dan gangguan makin sering. Perawatan tepat waktu memperlambat keausan, terlambat merawat mempercepatnya. Umur tiap unit berbeda, ada yang awet dan ada yang cepat rusak.</li><li><b>Rusak total</b>: mesin tidak bisa jalan. Pilih <b>Remajakan</b> (30 sampai 95% harga baru, kondisi pulih sebagian) atau <b>Scrap</b> (besi tua, 6% harga beli). Kondisi di bawah 50% juga bisa diremajakan.</li><li><b>Gadai</b>: bank memberi 50% nilai buku. <b>Jual</b>: dapat 35% dari harga beli.</li></ul>'},
 sched:{t:'Jadwal perawatan',h:'<p>Tiap mesin punya interval perawatan sendiri, bergantung pada merek. Biaya perawatan dihitung per unit.</p><ul><li>Mesin yang terlambat dirawat kehilangan keluaran dan lebih sering rusak.</li><li>Perkiraan biaya 60 hari ke depan membantu Anda menyiapkan kas.</li></ul>'},
 bank:{t:'Bank: pinjaman dan gadai',h:'<ul><li><b>Pinjaman</b>: cicilan ditagih tiap 30 hari. Bunga bergantung pada peringkat kredit A sampai D dan tenor. Limit tergantung kas dan nilai aset yang belum digadaikan.</li><li><b>Gadai</b>: dari tab Aset. Bunga 14% per tahun. Aset tetap beroperasi. Jika tidak ditebus dalam 365 hari, bank menyitanya.</li><li>Kas negatif terkena bunga utang harian. <b>Bangkrut</b> bila kas turun di bawah batas yang tampil di header. Batas itu ikut membesar seiring skala zaman.</li></ul>'},
 dir:{t:'Direktur dan spesialisasi',h:'<p>Satu direktur memimpin perusahaan Anda. Gajinya dibayar tiap hari sebagai biaya tetap, dan naik cepat seiring tingkat spesialisasi.</p><ul><li><b>Teknik</b> (0 sampai 5): tiap tingkat menurunkan biaya perawatan 4%, laju keausan mesin 5%, dan biaya bangun 2,5%.</li><li><b>Sosial-Politik</b> (0 sampai 5): tiap tingkat menurunkan peluang protes warga 8%, ganti rugi 5%, penundaan izin 8%, pajak karbon 4%, dan menaikkan batas tarif pemerintah 2%.</li><li>Tiap spesialisasi punya jenjang: <b>Pemula</b> (1 sampai 2), <b>Menengah</b> (3 sampai 4), <b>Ahli</b> (5). Makin tinggi jenjang, makin mahal gajinya.</li><li><b>Ekonomi</b> (0 sampai 5): tiap tingkat menurunkan biaya bahan bakar 3%, biaya tetap 4%, dan bunga pinjaman 0,3 poin.</li><li>Kandidat baru muncul tiap tahun. Tingkat tertinggi yang tersedia naik seiring zaman.</li><li>Mengganti atau memberhentikan direktur dikenai pesangon 25% gaji setahun.</li><li>Direktur mahal hanya sepadan bila armada Anda sudah besar.</li></ul>'},
 comp:{t:'Peringkat perusahaan',h:'<p>Peringkat menurut <b>kekayaan bersih</b>: kas ditambah nilai buku pembangkit, dikurangi utang bank dan gadai.</p><p>Saingan yang kasnya terlalu lama minus akan bangkrut dan asetnya dilelang murah. Anda bisa membelinya di bawah. Pelanggan memilih pemasok berdasarkan harga. Tarif lebih murah menarik porsi lebih besar, selama pasokan Anda cukup.</p>'},
 log:{t:'Kabar',h:'<p>Riwayat kejadian: peristiwa sejarah, harga bahan bakar, badai, letusan gunung, blackout, dan mesin baru yang mulai dijual.</p>'},

uent.", "Pajak karbon mulai berlaku dan naik bertahap tiap tahun.": "A carbon tax takes effect and rises gradually each year.", "Batas tarif tahun": "Tariff cap for the year", "/kWh.": "/kWh.", "Tarif Anda diturunkan paksa ke batas Rp": "Your tariff was forced down to the cap of Rp", "krisis ekonomi": "economic crisis", "kerugian besar": "heavy losses", "Jaringan listrik baru:": "New power grid:", "mulai beroperasi. Anda bisa membangun di sana.": "is now operating. You can build there.", "Kota baru tumbuh:": "A new city has grown:", "baru ditemukan:": "newly discovered:", "asetnya dilelang. Anda bisa membeli di tab Peringkat.": "its assets are up for auction. You can buy them in the Ranking tab.", "Aset": "Assets", "yang tak terjual diambil alih": "that go unsold are taken over", "Investor baru menghidupkan kembali": "New investors revive", "dengan modal segar.": "with fresh capital.", "Aset lelang tidak ditemukan.": "Auction asset not found.", "Kas kurang untuk membeli aset ini.": "Not enough cash to buy this asset.", "Anda membeli": "You bought", "dari lelang": "from the auction", "Warga menolak": "Residents reject", "Tuntutan warga tidak ditemukan.": "Residents' claim not found.", "Kas kurang untuk ganti rugi.": "Not enough cash for compensation.", "Ganti rugi": "Compensation", "dibayar. Warga sekitar": "paid. Local residents", "menarik protes.": "withdraw their protest.", "ditutup 45 hari karena penolakan warga.": "closed for 45 days due to resident opposition.", "Kandidat direktur baru tersedia untuk tahun": "New director candidates are available for the year", "Kandidat tidak ditemukan.": "Candidate not found.", "Kas kurang untuk pesangon direktur lama.": "Not enough cash for the old director's severance.", "Direktur baru:": "New director:", "(Teknik": "(Engineering", ", Ekonomi": ", Economics", ", Sosial-Politik": ", Social-Political", "Belum ada direktur.": "No director yet.", "Kas kurang untuk pesangon.": "Not enough cash for severance.", "Direktur": "Direc bangkit ditutup 45 hari. Keputusan otomatis \"tutup\" bila tidak dijawab dalam 3 hari.": "because of the plant's smoke. If refused, the plant is closed for 45 days. If unanswered within 3 days, \"close\" is chosen automatically.", "Bayar": "Pay", "Ganti rugi dibayar. Warga tenang.": "Compensation paid. Residents are calm.", "Tutup 45 hari": "Close for 45 days", "Pembangkit ditutup 45 hari.": "Plant closed for 45 days.", "Anda": "You", "▲ Gunung api": "▲ Volcano", "■ Kota besar": "■ Big city", "◆ Batubara": "◆ Coal", "● Gas": "● Gas", "Utang berjalan. Batas bangkrut: kas −": "Debt is running. Bankruptcy limit: cash −", "Cukup": "Enough", "Lihat rincian jaringan": "View grid details", ">Pasokan": ">Supply", "Membangun pembangkit": "Build a power plant", "Pilih": "Choose", ", dan": ", and", "mesin, lalu klik daratan di peta untuk menaruhnya.": "— then click land on the map to place it.", "Tahun menentukan pilihan.": "The year determines your options.", "Jenis dan merek baru muncul sesuai sejarah. PLTD dan PLTU ada sejak 1945, PLTG sejak 1965, PLTP sejak 1975, PLTS dan PLTB sejak 1990.": "New types and brands appear following history. Diesel and steam plants exist from 1945, gas from 1965, geothermal from 1975, solar and wind from 1990.", "Mesin makin baik seiring tahun.": "Machines get better over the years.", "Mesin lama lebih boros dan lebih sering rusak. Ukuran unit dan harga mengikuti skala zaman, jadi angka megawatt di 1945 jauh lebih kecil daripada di 2026.": "Old machines are thirstier and break more often. Unit sizes and prices follow the scale of the era, so megawatt figures in 1945 are far smaller than in 2026.", "Merek murah": "Cheap brands", "menekan biaya awal tetapi boros dan rewel.": "lower the upfront cost but are thirsty and fussy.", "Merek premium": "Premium brands", "mahal tetapi irit dan awet.": "cost more but are efficient and durable.", "Lokasi menentukan biaya, rugi transmisi, penyinaran, dan kekuatan angin.": "Location determines cost, transmission loss, sunlight, and wind strength.", ": pegunungan lebih mahal dan lebih lama dibangun daripada dataran, surya paling sensitif terhadap medan berbukit, angin justru lebih kencang di dataran tinggi.": ": mountains cost more and take longer to build than lowland; solar is most sensitive to hilly terrain, while wind is actually stronger on high ground.", "Bahan bakar": "Fuel", ": PLTU, PLTG, dan PLTD butuh angkutan dari tambang, ladang gas, atau depot BBM (titik di peta). Makin jauh, apalagi lewat laut, biaya bahan bakar makin besar. Sumber baru muncul sesuai tahun.": ": Coal, gas, and diesel plants need transport from mines, gas fields, or fuel depots (dots on the map). The farther, especially by sea, the higher the fuel cost. New sources appear over the years.", "PLTP hanya bisa dibangun dekat gunung api.": "Geothermal can only be built near a volcano.", "Aset dan upgrade": "Assets and upgrades", "Daftar pembangkit milik Anda. Ketuk satu baris untuk membuka tombolnya.": "Your list of power plants. Tap a row to reveal its buttons.", "Rawat": "Maintain", ": menghentikan mesin beberapa hari, tetapi menurunkan risiko rusak. Perawatan otomatis berjalan bila kas cukup.": ": stops the machine for a few days but lowers breakdown risk. Maintenance runs automatically when cash is enough.", "Overhaul Lv 1 sampai 3": "Overhaul Lv 1 to 3", ": keluaran naik 5%, pemakaian bahan bakar turun 4%, dan risiko gangguan turun 12% per level. Mesin berhenti 8 hari.": ": output +5%, fuel use −4%, and fault risk −12% per level. The machine stops for 8 days.", "Perbesar kapasitas": "Increase capacity", ": mesin diganti dengan ukuran berikutnya dari merek yang sama, nilai lama diperhitungkan 50%.": ": the machine is replaced with the next size of the same brand, with the old value counted at 50%.", "Kondisi dan umur": "Condition and age", ": mesin aus seiring waktu. Makin aus, keluaran turun dan gangguan makin sering. Perawatan tepat waktu memperlambat keausan, terlambat merawat mempercepatnya. Umur tiap unit berbeda, ada yang awet dan ada yang cepat rusak.": ": machines wear out over time. The more worn, the lower the output and the more frequent the faults. Timely maintenance slows wear; late maintenance speeds it up. Each unit's lifespan differs.", "Rusak total": "Fully broken", ": mesin tidak bisa jalan. Pilih": ": the machine cannot run. Choose", "(45% harga beli, kondisi pulih sebagian) atau": "(45% of purchase price, condition partly restored) or", "(besi tua, 6% harga beli). Kondisi di bawah 50% juga bisa diremajakan.": "(scrap, 6% of purchase price). Machines below 50% condition can also be refurbished.", ": bank memberi 50% nilai buku.": ": the bank gives 50% of book value.", "Jual": "Sell", ": dapat 35% dari harga beli.": ": get 35% of the purchase price.", "Jadwal perawatan": "Maintenance schedule", "Tiap mesin punya interval perawatan sendiri, bergantung pada merek. Biaya perawatan dihitung per unit.": "Each machine has its own maintenance interval depending on brand. Maintenance cost is per unit.", "Mesin yang terlambat dirawat kehilangan keluaran dan lebih sering rusak.": "Machines with overdue maintenance lose output and break more often.", "Perkiraan biaya 60 hari ke depan membantu Anda menyiapkan kas.": "The 60-day cost forecast helps you prepare cash.", "Bank: pinjaman dan gadai": "Bank: loans and pawns", "Pinjaman": "Loan", ": cicilan ditagih tiap 30 hari. Bunga bergantung pada peringkat kredit A sampai D dan tenor. Limit tergantung kas dan nilai aset yang belum digadaikan.": ": installments are billed every 30 days. Interest depends on credit rating A to D and tenor. The limit depends on cash and the value of unpawned assets.", ": dari tab Aset. Bunga 14% per tahun. Aset tetap beroperasi. Jika tidak ditebus dalam 365 hari, bank menyitanya.": ": from the Assets tab. Interest 14% per year. The asset keeps operating. If not redeemed within 365 days, the bank seizes it.", "Kas negatif terkena bunga utang harian.": "Negative cash incurs daily debt interest.", "Bangkrut": "Bankrupt", "bila kas turun di bawah batas yang tampil di header. Batas itu ikut membesar seiring skala zaman.": "if cash drops below the limit shown in the header. That limit grows with the scale of the era.", "Direktur dan spesialisasi": "Directors and specialties", "Satu direktur memimpin perusahaan Anda. Gajinya dibayar tiap hari sebagai biaya tetap, dan naik cepat seiring tingkat spesialisasi.": "One director leads your company. The salary is paid daily as a fixed cost and rises fast with specialty level.", "Teknik": "Engineering", "(0 sampai 5): tiap tingkat menurunkan biaya perawatan 4%, laju keausan mesin 5%, dan biaya bangun 2,5%.": "(0 to 5): each level cuts maintenance cost 4%, machine wear rate 5%, and build cost 2.5%.", "Sosial-Politik": "Social-Political", "(0 sampai 5): tiap tingkat menurunkan peluang protes warga 8%, ganti rugi 5%, penundaan izin 8%, pajak karbon 4%, dan menaikkan batas tarif pemerintah 2%.": "(0 to 5): each level cuts resident protest chance 8%, compensation 5%, permit delay 8%, carbon tax 4%, and raises the government tariff cap 2%.", "Tiap spesialisasi punya jenjang:": "Each specialty has tiers:", "Pemula": "Beginner", "(1 sampai 2),": "(1 to 2),", "Menengah": "Intermediate", "(3 sampai 4),": "(3 to 4),", "Ahli": "Expert", "(5). Makin tinggi jenjang, makin mahal gajinya.": "(5). The higher the tier, the higher the salary.", "Ekonomi": "Economics", "(0 sampai 5): tiap tingkat menurunkan biaya bahan bakar 3%, biaya tetap 4%, dan bunga pinjaman 0,3 poin.": "(0 to 5): each level cuts fuel cost 3%, fixed cost 4%, and loan interest 0.3 points.", "Kandidat baru muncul tiap tahun. Tingkat tertinggi yang tersedia naik seiring zaman.": "New candidates appear every year. The highest available level rises with the era.", "Mengganti atau memberhentikan direktur dikenai pesangon 25% gaji setahun.": "Replacing or dismissing a director costs severance of 25% of annual salary.", "Direktur mahal hanya sepadan bila armada Anda sudah besar.": "An expensive director only pays off once your fleet is large.", "Peringkat perusahaan": "Company ranking", "Peringkat menurut": "Ranked by", "kekayaan bersih": "net worth", ": kas ditambah nilai buku pembangkit, dikurangi utang bank dan gadai.": ": cash plus plant book value, minus bank debt and pawns.", "Saingan yang kasnya terlalu lama minus akan bangkrut dan asetnya dilelang murah. Anda bisa membelinya di bawah. Pelanggan memilih pemasok berdasarkan harga. Tarif lebih murah menarik porsi lebih besar, selama pasokan Anda cukup.": "Rivals whose cash stays negative too long go bankrupt and their assets are auctioned cheaply. You can buy them below. Customers pick suppliers by price. A lower tariff attracts a larger share, as long as your supply is enough.", "Kabar": "News", "Riwayat kejadian: peristiwa sejarah, harga bahan bakar, badai, letusan gunung, blackout, dan mesin baru yang mulai dijual.": "Event history: historical events, fuel prices, storms, volcanic eruptions, blackouts, and new machines going on sale.", "Pembukuan": "Accounts", "Laba rugi": "Profit and loss", ": pendapatan dikurangi bahan bakar, biaya tetap, perawatan, denda padam, pajak karbon, dan bunga.": ": revenue minus fuel, fixed costs, maintenance, outage fines, carbon tax, and interest.", "Neraca": "Balance sheet", ": aset (kas dan nilai buku pembangkit) dikurangi utang menghasilkan kekayaan bersih.": ": assets (cash and plant book value) minus debt gives net worth.", "Grafik dan tabel diperbarui tiap akhir bulan. Nilai uang dalam harga konstan agar bisa dibandingkan antar zaman.": "Charts and tables update at the end of each month. Money is in constant prices so eras can be compared.", "Arti ikon tombol": "Button icon meanings", "Biaya perawatan. Mesin berhenti beberapa hari, tetapi risiko rusak turun dan keausan pulih.": "Maintenance cost. The machine stops for a few days, but breakdown risk drops and wear recovers.", "Overhaul Lv": "Overhaul Lv", "Naikkan level (1 sampai 3): keluaran +5%, bahan bakar -4%, gangguan -12%. Mesin berhenti 8 hari.": "Raise the level (1 to 3): output +5%, fuel −4%, faults −12%. The machine stops for 8 days.", "Perbesar": "Upsize", "Tukar mesin ke kapasitas lebih besar. Nilai lama dihitung 50%. Angka menunjukkan kapasitas baru dan biayanya.": "Swap the machine for a larger capacity. The old value counts 50%. The number shows the new capacity and cost.", "Pulihkan kondisi mesin yang aus atau rusak total. Biaya sekitar 45% harga beli.": "Restore a worn or fully broken machine. Cost is about 45% of purchase price.", "Jual mesin rusak sebagai besi tua. Anda mendapat kembali sekitar 6% harga beli.": "Sell a broken machine as scrap. You get back about 6% of the purchase price.", "Pinjam dari bank dengan jaminan mesin, sekitar 50% nilai buku. Mesin tetap beroperasi.": "Borrow from the bank using the machine as collateral, about 50% of book value. The machine keeps operating.", "Tebus": "Redeem", "Lunasi gadai untuk mendapatkan kembali mesin sebelum jatuh tempo.": "Repay the pawn to get the machine back before it falls due.", "Jual mesin ke pasar. Ketuk dua kali untuk konfirmasi. Mesin rusak total tidak bisa dijual, gunakan Scrap.": "Sell the machine on the market. Tap twice to confirm. Fully broken machines cannot be sold; use Scrap.", "Angka di samping ikon adalah biaya atau hasil dalam Rupiah.": "The number beside an icon is the cost or proceeds in Rupiah.", "Arti ikon mesin": "Machine icon meanings", "Kapasitas": "Capacity", "Daya maksimum satu unit, dalam megawatt (MW). Makin besar, makin banyak listrik yang bisa dijual.": "Maximum power of one unit, in megawatts (MW). The bigger, the more electricity you can sell.", "Lama bangun": "Build time", "Hari yang dibutuhkan sampai mesin mulai beroperasi. Di medan pegunungan lebih lama.": "Days needed until the machine starts operating. Longer in mountain terrain.", "Perawatan berkala": "Periodic maintenance", "Interval perawatan dalam hari dan biaya sekali rawat. Mesin berhenti sebentar saat dirawat. Telat merawat membuat mesin cepat aus.": "Maintenance interval in days and cost per service. The machine stops briefly during maintenance. Late maintenance makes it wear fast.", "Pemakaian bahan bakar dibanding mesin standar. Di bawah ×1,00 lebih irit, di atas lebih boros. Mesin tanpa bahan bakar menampilkan 0.": "Fuel use compared with a standard machine. Below ×1.00 is more efficient, above is thirstier. Fuel-free machines show 0.", "Hasil keluaran": "Output yield", "Seberapa besar daya yang benar-benar dihasilkan dibanding kapasitasnya. Di atas ×1,00 lebih baik.": "How much power is actually produced compared with capacity. Above ×1.00 is better.", "Risiko gangguan": "Fault risk", "Peluang mesin mogok. Di bawah ×1,00 lebih awet, di atas lebih sering rusak.": "Chance of breakdown. Below ×1.00 is more durable, above breaks more often.", "Ikon chip di atas daftar merek menandai pilihan merek mesin. Ikon petir di atas daftar ukuran menandai pilihan kapasitas.": "The chip icon above the brand list marks machine brand choices. The lightning icon above the size list marks capacity choices.", "Jaringan listrik": "Power grid", "Jaringan listrik terpisah, umumnya satu per pulau besar. Batang berwarna menunjukkan porsi tiap perusahaan. Permintaan naik sekitar 5% per tahun, lebih cepat bila perusahaan-perusahaan punya banyak kas, lebih lambat bila kas menipis. Saingan hanya membangun bila kasnya cukup.": "Separate power grids, usually one per large island. The colored bar shows each company's share. Demand grows about 5% per year, faster when companies have plenty of cash, slower when cash runs thin. Rivals only build when they have enough cash.", "Ketat": "Tight", "berarti pasokan kurang dari 15% di atas kebutuhan,": "means supply is less than 15% above demand,", "Kurang": "Short", "berarti sebagian pelanggan padam dan perusahaan kena denda.": "means some customers lose power and companies are fined.", "Regulasi pemerintah": "Government regulation", "Pemerintah ikut campur seiring zaman.": "The government gets more involved over time.", "Batas tarif": "Tariff cap", "(sejak 1970): tarif jual tidak boleh melewatinya.": "(since 1970): the selling price may not exceed it.", "Izin lingkungan": "Environmental permit", "(sejak 1982): pembangkit batu bara, diesel, dan gas ditolak bila terlalu dekat kota.": "(since 1982): coal, diesel, and gas plants are refused if too close to a city.", "Protes warga": "Resident protests", ": pembangkit berasap dekat kota bisa diprotes. Anda bisa membayar ganti rugi, atau menutup pembangkit 45 hari.": ": smoky plants near cities can be protested. You can pay compensation or close the plant for 45 days.", "Pajak karbon": "Carbon tax", "(sejak 2005): naik tiap tahun, sesuai emisi bahan bakar.": "(since 2005): rises each year according to fuel emissions.", "Direktur Sosial-Politik meringankan semuanya.": "A Social-Political director eases all of these.", "Mengerti": "Got it", "Selamat datang, tahun 1945": "Welcome, the year 1945", "Sebuah negeri kepulauan baru berdiri dan listrik masih langka. Anda mendirikan": "A new island nation has just formed and electricity is still scarce. You found a", "perusahaan pembangkit baru": "new power company", "tanpa satu mesin pun, di tengah tiga pesaing yang sudah punya pembangkit.": "with no machines at all, among three rivals that already have plants.", "Satu tujuan:": "One goal:", "jangan sampai bangkrut": "don't go bankrupt", "Indonesia baru merdeka dan listrik masih langka. Anda mendirikan": "Indonesia has just become independent and electricity is still scarce. You found a", "Peta dan jaringan": "Map and grids", "Peta terbagi beberapa jaringan listrik terpisah, umumnya satu per pulau besar. Label di peta menunjukkan kebutuhan tiap jaringan. Hijau berarti cukup, kuning ketat, merah kekurangan.": "The map is split into several separate power grids, usually one per large island. Map labels show each grid's demand. Green means enough, yellow tight, red short.", "Seret peta untuk menggeser, gunakan tombol + dan − untuk zoom. Kota besar, garis jaringan, dan titik sumber bahan bakar bisa disembunyikan. Pembangkit bahan bakar yang dekat tambang, ladang gas, atau depot punya biaya angkut lebih murah.": "Drag the map to pan, use the + and − buttons or pinch to zoom. Big cities, grid lines, and fuel source points can be hidden. Fuel plants near mines, gas fields, or depots have cheaper transport costs.", "Bangun mesin pertama": "Build your first machine", "Buka tab": "Open the", "Bangun": "Build", "mesin, lalu klik daratan di peta.": "tab, then click land on the map.", "Mesin yang dijual menyesuaikan tahun: di 1945 hanya PLTD diesel dan PLTU uap. Jenis lain muncul bertahap dan mesinnya makin baik.": "Machines on sale depend on the year: in 1945 only diesel and steam plants. Other types appear gradually and machines get better.", "Tarif dan waktu": "Tariff and time", "Atur": "Set the", "tarif jual": "selling price", "dengan tombol − dan + di atas. Tarif murah menarik pelanggan, tarif mahal memberi untung per kWh.": "with the − and + buttons above. A low tariff attracts customers, a high tariff gives more profit per kWh.", "Permainan dimulai dalam keadaan": "The game starts", "Rawat dan tingkatkan": "Maintain and upgrade", "Tab": "The", "Jadwal": "Schedule", ": mesin perlu dirawat berkala. Ketuk satu aset untuk": ": machines need periodic maintenance. Tap an asset to", "(lebih irit dan awet) atau": "(more efficient and durable) or", "perbesar kapasitas": "increase capacity", "Awas harga bahan bakar, badai, letusan gunung, dan krisis sejarah yang bisa menekan keuangan.": "Watch out for fuel prices, storms, volcanic eruptions, and historical crises that can squeeze your finances.", "Bank dan pembukuan": "Bank and accounts", "Bank": "Bank", "untuk pinjaman dan gadai aset. Tab": "for loans and asset pawns. The", "Buku": "Books", "menampilkan laba rugi, neraca, dan grafik perkembangan perusahaan dari ta function koto(t,m,v){var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o2.type='triangle';o.frequency.value=hz(m);o2.frequency.value=hz(m)*2.005;f.type='lowpass';f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+.5);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+1.5);o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+1.6);o2.stop(t+1.6)}

function sched(t,s){
  var bar=Math.floor(s/8)%8,pos=s%8,root=ROOTS[bar];

  try{var el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen().then(go,go)}else go()}catch(e){go()}}

function seg(name,opts,cur){return '<div class="seg" role="group">'+opts.map(function(o){return '<button type="button" class="btn sm'+(o[0]===cur?' on':'')+'" data-set="'+name+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'}
function openSet(){var m=$('smodal');
  m.innerHTML='<div class="mbox ibox"><h2>Pengaturan</h2><div class="cbody"><h4>Bahasa</h4>'+seg('lang',[['id','Indonesia'],['en','English']],ST.lang)+'<h4>Orientasi layar</h4>'+seg('orient',[['auto','Otomatis'],['port','Potret'],['land','Lanskap']],ST.orient)+'<h4>Musik latar</h4>'+seg('music',[['1','Musik hidup'],['0','Musik mati']],ST.music?'1':'0')+'<div class="vrow"><span>Volume</span><input id="vol" type="range" min="0" max="100" value="'+Math.round(ST.vol*100)+'" aria-label="Volume"></div><p class="note">Musik bergaya retro Jepang, dibuat langsung oleh peramban.</p><p class="note" id="setmsg"></p><p class="note">Pengaturan disimpan di perangkat ini.</p></div><div class="cb"><button class="btn" data-set="close">Tutup</button></div></div>';
  m.className='show';if(ST.lang==='en')walk(m)}
function closeSet(){$('smodal').className=''}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act="settings"],[data-set]');if(!b)return;
  if(b.getAttribute('data-act')==='settings'){e.stopPropagation();openSet();return}
  var n=b.getAttribute('data-set'),v=b.getAttribute('data-v');
  if(n==='close'){closeSet();return}
  if(n==='lang'){ST.lang=v;save();applyLang();openSet();return}
  if(n==='orient'){ST.orient=v;save();openSet();lockOr(v);return}
  if(n==='music'){ST.music=v==='1';save();started=true;syncMusic();openSet();return}
},true);
document.addEventListener('input',function(e){if(e.target&&e.target.id==='vol')setVol(e.target.value/100)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('smodal').className==='show')closeSet()});
$('smodal').addEventListener('click',function(e){if(e.target===this)closeSet()});
if(ST.lang==='en')applyLang();else observe();
})();
</script>
</body>
